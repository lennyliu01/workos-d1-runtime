name: RW Batch07 D1 Authority Pointer CAS Candidate
on:
  push:
    branches:
      - candidate/rw-batch07-d1-authority-cas-20261104-01
permissions:
  contents: read
jobs:
  isolated-cas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npx tsx tests/rw_batch07_d1_authority_pointer_cas_validation.ts
      - run: npm run test:rw-r4-d1
      - run: npm run test:workos-business-executor
