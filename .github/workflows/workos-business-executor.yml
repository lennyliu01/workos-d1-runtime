name: WorkOS Business Executor Candidate

on:
  schedule:
    - cron: '0 2 * * *'
    - cron: '15 4 * * *'
  workflow_dispatch:
    inputs:
      task_id:
        description: Registered Task_ID for READ-only witness
        required: true
        type: choice
        options:
          - US_JAPAN_FX_POLICY
          - ROLLING_WEDGE_INVESTMENT
      witness_read_only:
        description: Must remain true before production cutover
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/workos-business-executor.yml'
      - '.github/workflows/runtime-invocation-adapter.yml'
      - 'src/workos_*.ts'
      - 'src/runtime_invocation_client.ts'
      - 'tests/workos_*validation.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: >-
    workos-business-executor-${{
      github.event.schedule == '0 2 * * *' && 'US_JAPAN_FX_POLICY' ||
      github.event.schedule == '15 4 * * *' && 'ROLLING_WEDGE_INVESTMENT' ||
      inputs.task_id || 'validation'
    }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Freeze generated dependency lock for candidate
        uses: actions/upload-artifact@v4
        with:
          name: workos-business-executor-package-lock
          path: package-lock.json
          if-no-files-found: error
      - run: npm run typecheck
      - run: npm run test:workos-business-executor

  execute:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Resolve candidate route and production fence
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DISPATCH_TASK_ID: ${{ inputs.task_id }}
          WITNESS_READ_ONLY: ${{ inputs.witness_read_only }}
          FX_ENABLED: ${{ vars.WORKOS_EXECUTOR_FX_ENABLED }}
          RW_ENABLED: ${{ vars.WORKOS_EXECUTOR_RW_ENABLED }}
        run: |
          set -euo pipefail
          execute=false
          task_id=""
          if [ "$EVENT_NAME" = "schedule" ]; then
            case "$EVENT_SCHEDULE" in
              '0 2 * * *') task_id='US_JAPAN_FX_POLICY'; enabled="${FX_ENABLED:-}" ;;
              '15 4 * * *') task_id='ROLLING_WEDGE_INVESTMENT'; enabled="${RW_ENABLED:-}" ;;
              *) echo "Unknown schedule: $EVENT_SCHEDULE" >&2; exit 20 ;;
            esac
            if [ "$enabled" = "true" ]; then
              execute=true
            else
              echo "Production fence closed for $task_id; skipping candidate production execution."
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            case "$DISPATCH_TASK_ID" in US_JAPAN_FX_POLICY|ROLLING_WEDGE_INVESTMENT) ;; *) exit 21 ;; esac
            [ "$WITNESS_READ_ONLY" = "true" ] || { echo "Witness must be READ-only" >&2; exit 22; }
            task_id="$DISPATCH_TASK_ID"
            execute=true
          else
            exit 23
          fi
          echo "execute=$execute" >> "$GITHUB_OUTPUT"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"

      - name: Authenticate Google control-plane reader
        if: steps.route.outputs.execute == 'true'
        id: google_auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.WORKOS_EXECUTOR_GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.WORKOS_EXECUTOR_GOOGLE_SERVICE_ACCOUNT }}
          access_token_scopes: >-
            https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/spreadsheets.readonly

      - name: Execute registered WorkOS Workflow or READ-only witness
        if: steps.route.outputs.execute == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          WORKOS_TASK_ID: ${{ steps.route.outputs.task_id }}
          WORKOS_WITNESS_READ_ONLY: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
          WORKOS_PRODUCTION_WRITES_ENABLED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          WORKOS_EXECUTOR_FX_ENABLED: ${{ vars.WORKOS_EXECUTOR_FX_ENABLED }}
          WORKOS_EXECUTOR_RW_ENABLED: ${{ vars.WORKOS_EXECUTOR_RW_ENABLED }}
          WORKOS_SCHEDULED_OCCURRENCE: ${{ github.event.schedule }}:${{ github.run_id }}
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
          OPENAI_WIF_TOKEN_EXCHANGE_URL: ${{ vars.OPENAI_WIF_TOKEN_EXCHANGE_URL }}
          RUNTIME_SECRET: ${{ secrets.RUNTIME_SECRET }}
        run: npx tsx src/workos_business_executor.ts
