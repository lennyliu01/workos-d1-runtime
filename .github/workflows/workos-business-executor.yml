name: WorkOS Business Executor Candidate

on:
  workflow_dispatch:
    inputs:
      witness_mode:
        description: Explicit non-production witness path
        required: true
        default: workos_read_only
        type: choice
        options:
          - workos_read_only
          - openai_live
      task_id:
        description: Registered Task_ID for READ-only WorkOS witness; leave empty for OpenAI witness
        required: false
        default: ''
        type: string
      witness_read_only:
        description: Must remain true before production cutover
        required: true
        default: true
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/workos-business-executor.yml'
      - '.github/workflows/runtime-invocation-adapter.yml'
      - 'src/workos_*.ts'
      - 'src/runtime_invocation_client.ts'
      - 'tests/workos_*validation.ts'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read
  id-token: write

concurrency:
  group: >-
    workos-business-executor-${{
      (github.event_name == 'workflow_dispatch' && inputs.witness_mode == 'openai_live' && 'openai-live-witness') ||
      inputs.task_id || 'validation'
    }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Freeze generated dependency lock for candidate
        uses: actions/upload-artifact@v4
        with:
          name: workos-business-executor-package-lock
          path: package-lock.json
          if-no-files-found: error
      - run: npm run typecheck
      - run: npm run test:workos-business-executor
      - run: npx tsx tests/workos_openai_live_witness_validation.ts

  execute:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Resolve manual witness route
        id: route
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_MODE: ${{ inputs.witness_mode }}
          DISPATCH_TASK_ID: ${{ inputs.task_id }}
          WITNESS_READ_ONLY: ${{ inputs.witness_read_only }}
        run: |
          set -euo pipefail
          execute=false
          openai_witness=false
          task_id=""
          [ "$EVENT_NAME" = "workflow_dispatch" ] || exit 23
          [ "$WITNESS_READ_ONLY" = "true" ] || { echo "Witness must be READ-only" >&2; exit 22; }
          case "${DISPATCH_MODE:-workos_read_only}" in
            workos_read_only)
              case "$DISPATCH_TASK_ID" in US_JAPAN_FX_POLICY|ROLLING_WEDGE_INVESTMENT) ;; *) exit 21 ;; esac
              task_id="$DISPATCH_TASK_ID"
              execute=true
              ;;
            openai_live)
              [ -z "${DISPATCH_TASK_ID:-}" ] || { echo "OpenAI witness must not carry a WorkOS Task_ID" >&2; exit 24; }
              openai_witness=true
              ;;
            *)
              echo "Unknown witness mode: $DISPATCH_MODE" >&2
              exit 25
              ;;
          esac
          echo "execute=$execute" >> "$GITHUB_OUTPUT"
          echo "openai_witness=$openai_witness" >> "$GITHUB_OUTPUT"
          echo "task_id=$task_id" >> "$GITHUB_OUTPUT"

      - name: Authenticate Google control-plane reader
        if: steps.route.outputs.execute == 'true'
        id: google_auth
        uses: google-github-actions/auth@v2
        with:
          token_format: access_token
          workload_identity_provider: ${{ vars.WORKOS_EXECUTOR_GOOGLE_WIF_PROVIDER }}
          service_account: ${{ vars.WORKOS_EXECUTOR_GOOGLE_SERVICE_ACCOUNT }}
          access_token_scopes: >-
            https://www.googleapis.com/auth/drive.readonly,https://www.googleapis.com/auth/spreadsheets.readonly

      - name: Execute isolated OpenAI WIF + Responses live witness
        if: steps.route.outputs.openai_witness == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WORKOS_OPENAI_LIVE_WITNESS: 'true'
          WORKOS_PRODUCTION_WRITES_ENABLED: 'false'
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
        run: npx tsx src/workos_openai_live_witness.ts
      - name: Execute registered WorkOS Workflow or READ-only witness
        if: steps.route.outputs.execute == 'true'
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          WORKOS_TASK_ID: ${{ steps.route.outputs.task_id }}
          WORKOS_WITNESS_READ_ONLY: 'true'
          WORKOS_PRODUCTION_WRITES_ENABLED: 'false'
          GOOGLE_OAUTH_ACCESS_TOKEN: ${{ steps.google_auth.outputs.access_token }}
          RUNTIME_SECRET: ${{ secrets.RUNTIME_SECRET }}
        run: npx tsx src/workos_business_executor.ts
