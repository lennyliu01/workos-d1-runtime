name: CUTOVER Witness Governed Publication Readiness

on:
  workflow_dispatch:
    inputs:
      approved_candidate_commit:
        description: Exact PCV/Human-approved repair candidate commit
        required: true
        type: string
      accepted_main_commit:
        description: Exact post-merge accepted main commit to deploy
        required: true
        type: string
      provider_config_id:
        description: Exact PCV/Human-approved Provider_Config_ID
        required: true
        type: string
      acceptance_binding_id:
        description: Exact PCV/Human-approved candidate Acceptance_Binding_ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy-readiness:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      RUNTIME_SECRET: ${{ secrets.RUNTIME_SECRET }}
      CUTOVER_WITNESS_GOOGLE_ACCESS_TOKEN: ${{ secrets.CUTOVER_WITNESS_GOOGLE_ACCESS_TOKEN }}
      WORKER_URL: https://workos-cutover-witness.lennyliu01.workers.dev
      APPROVED_CANDIDATE_COMMIT: ${{ inputs.approved_candidate_commit }}
      ACCEPTED_MAIN_COMMIT: ${{ inputs.accepted_main_commit }}
      PROVIDER_CONFIG_ID: ${{ inputs.provider_config_id }}
      ACCEPTANCE_BINDING_ID: ${{ inputs.acceptance_binding_id }}
    steps:
      - name: Verify required deployment credentials are bound
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$RUNTIME_SECRET"
          test -n "$CUTOVER_WITNESS_GOOGLE_ACCESS_TOKEN"
          echo "DEPLOYMENT_CREDENTIAL_BINDINGS_PRESENT=TRUE"
          echo "SECRET_VALUES_DISCLOSED=FALSE"

      - name: Check out exact accepted main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.accepted_main_commit }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prove accepted build matches approved candidate runtime surface
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$ACCEPTED_MAIN_COMMIT"
          git fetch --no-tags origin "$APPROVED_CANDIDATE_COMMIT"
          git cat-file -e "$APPROVED_CANDIDATE_COMMIT^{commit}"
          git diff --exit-code "$APPROVED_CANDIDATE_COMMIT" "$ACCEPTED_MAIN_COMMIT" --             src/cutover_executor.ts             src/cutover_witness_fixture.ts             src/cutover_witness_invocation.ts             src/cutover_witness_runtime_config.ts             src/cutover_witness_worker.ts             wrangler.cutover-witness.jsonc
          echo "APPROVED_CANDIDATE_RUNTIME_EQ_ACCEPTED_MAIN=TRUE"

      - name: Install and validate exact accepted build
        run: |
          set -euo pipefail
          npm install
          npm run typecheck
          npm run test:cutover-owner
          npm run test:cutover-postpub
          npm run test:cutover-deployment-config

      - name: Deploy exact accepted witness Worker with bounded secrets
        shell: bash
        run: |
          set -euo pipefail
          SECRETS_FILE="$(mktemp)"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          chmod 600 "$SECRETS_FILE"
          {
            printf 'RUNTIME_SECRET=%s\n' "$RUNTIME_SECRET"
            printf 'CUTOVER_WITNESS_GOOGLE_ACCESS_TOKEN=%s\n' "$CUTOVER_WITNESS_GOOGLE_ACCESS_TOKEN"
          } > "$SECRETS_FILE"
          npx wrangler deploy             --config wrangler.cutover-witness.jsonc             --secrets-file "$SECRETS_FILE"             --var CUTOVER_WITNESS_BUILD_COMMIT:"$ACCEPTED_MAIN_COMMIT"             --var CUTOVER_WITNESS_PROVIDER_CONFIG_ID:"$PROVIDER_CONFIG_ID"
          rm -f "$SECRETS_FILE"
          trap - EXIT
          echo "WORKER_DEPLOYED=TRUE"
          echo "SECRET_VALUES_DISCLOSED=FALSE"

      - name: Exact deployed build and configured-provider readiness readback
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp)"
          CODE="$(curl -sS -o "$OUT" -w '%{http_code}'             -H "Authorization: Bearer $RUNTIME_SECRET"             "$WORKER_URL/cutover/witness/readiness")"
          test "$CODE" = "200"
          jq -e             --arg commit "$ACCEPTED_MAIN_COMMIT"             --arg provider "$PROVIDER_CONFIG_ID"             --arg binding "$ACCEPTANCE_BINDING_ID"             '
              .status == "READY" and
              .service == "workos-cutover-witness" and
              .build_commit == $commit and
              .provider_config_id == $provider and
              .formal_route == "/cutover/witness" and
              .caller_auth_binding == "RUNTIME_SECRET" and
              .provider_auth_mode == "GOOGLE_OAUTH_BEARER_ACCESS_TOKEN_EPHEMERAL" and
              .google_credential_binding == "CUTOVER_WITNESS_GOOGLE_ACCESS_TOKEN" and
              .credential_value_disclosed == false and
              .provider_readiness.provider == "GoogleSheetsControlPlaneProvider" and
              .provider_readiness.fixture_root_id == "GFR1_7bd591adcefe2c5b178eeb49af142e4b4f25b4da83caba8b6d44546617c1f40e" and
              .provider_readiness.fixture_spreadsheet_id == "11DKed3wVcnryEQrgHzfR276znYJLRAwM14ZOEwCkS1Y" and
              .provider_readiness.exact_readback == true and
              .provider_readiness.credential_present == true and
              .provider_readiness.credential_value_disclosed == false
            ' "$OUT" >/dev/null
          echo "DEPLOYED_BUILD_READBACK=$ACCEPTED_MAIN_COMMIT"
          echo "PROVIDER_CONFIG_READBACK=$PROVIDER_CONFIG_ID"
          echo "ACCEPTANCE_BINDING_PENDING_ACTIVATION=$ACCEPTANCE_BINDING_ID"
          echo "GOOGLE_PROVIDER_READINESS=TRUE"
          echo "SECRET_VALUES_DISCLOSED=FALSE"

      - name: Verify authenticated formal route is deployed
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(mktemp)"
          CODE="$(curl -sS -o "$OUT" -w '%{http_code}'             -X POST "$WORKER_URL/cutover/witness"             -H 'Content-Type: application/json'             --data '{}')"
          test "$CODE" = "401"
          jq -e '.status == "FAILED" and .error == "UNAUTHORIZED"' "$OUT" >/dev/null

          CODE="$(curl -sS -o "$OUT" -w '%{http_code}'             -X POST "$WORKER_URL/cutover/witness"             -H "Authorization: Bearer $RUNTIME_SECRET"             -H 'Content-Type: application/json'             --data '{}')"
          test "$CODE" = "400"
          jq -e '.status == "FAILED" and .error == "INVALID_WITNESS_INVOCATION"' "$OUT" >/dev/null
          echo "FORMAL_ROUTE_DEPLOYED_AND_AUTHENTICATED=TRUE"
          echo "GOVERNED_8_CASE_WITNESS_EXECUTED=FALSE"

      - name: Publication handoff fence
        shell: bash
        run: |
          set -euo pipefail
          echo "DEPLOYMENT_READINESS_COMPLETE=TRUE"
          echo "ACCEPTANCE_ACTIVATION_PERFORMED=FALSE"
          echo "NEXT=publisher may materialize/activate only the exact approved binding after consuming this run's exact readiness evidence"
