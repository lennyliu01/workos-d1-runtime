name: Prototype Runtime Invocation Adapter

on:
  issues:
    types:
      - opened

jobs:
  invoke:
    if: >-
      github.event.issue.title == '[RUNTIME_INVOCATION] TIME_ROUNDTRIP' ||
      github.event.issue.title == '[RUNTIME_INVOCATION] STATE_COMPARE_AND_SET' ||
      github.event.issue.title == '[RUNTIME_INVOCATION] READ' ||
      github.event.issue.title == '[RUNTIME_INVOCATION] WRITE'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      RUNTIME_SECRET: ${{ secrets.RUNTIME_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund

      - name: Validate invocation and call shared runtime client
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RUNTIME_SECRET"
          npx tsx src/runtime_invocation_client.ts "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/runtime-invocation-result.txt"
          test -s "$RUNNER_TEMP/runtime-invocation-result.txt"

      - name: Return terminal runtime result to exact issue
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body-file "$RUNNER_TEMP/runtime-invocation-result.txt"

      - name: Return terminal adapter failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$REPOSITORY" --body "RUNTIME_INVOCATION_RESULT
          Status: FAILED
          Error: ADAPTER_OR_RUNTIME_FAILURE
          Return_Target: CALLER
          Transport: GITHUB_ACTIONS"
