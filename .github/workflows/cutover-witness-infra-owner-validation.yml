name: Cutover Witness Infrastructure Owner Validation

on:
  pull_request:
    paths:
      - "src/cutover_executor.ts"
      - "tests/cutover_executor_owner_validation.ts"
      - "package.json"
      - ".github/workflows/cutover-witness-infra-owner-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Implementation-level owner validation
        run: npm run test:cutover-owner
