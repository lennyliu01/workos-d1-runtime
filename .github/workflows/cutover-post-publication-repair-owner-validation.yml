name: Cutover Post-Publication Witness Repair Validation

on:
  pull_request:
    paths:
      - "src/cutover_executor.ts"
      - "src/cutover_witness_fixture.ts"
      - "src/cutover_witness_invocation.ts"
      - "src/cutover_witness_runtime_config.ts"
      - "src/cutover_witness_worker.ts"
      - "src/index.ts"
      - "wrangler.cutover-witness.jsonc"
      - ".github/workflows/cutover-witness-governed-publication-readiness.yml"
      - "tests/cutover_executor_owner_validation.ts"
      - "tests/cutover_post_publication_repair_owner_validation.ts"
      - "tests/cutover_post_publication_candidate_binding_validation.ts"
      - "tests/cutover_deployment_config_repair_owner_validation.ts"
      - "tests/cutover_deployment_config_candidate_binding_validation.ts"
      - "tests/cutover_wif_contract_validation.ts"
      - "candidate_evidence/cutover_witness_post_publication_repair_20260930_01.json"
      - "candidate_evidence/cutover_witness_deployment_config_repair_20260930_01.json"
      - "package.json"
      - ".github/workflows/cutover-post-publication-repair-owner-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owner-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Existing CUTOVER invariant regression
        run: npm run test:cutover-owner
      - name: Post-publication invocation and CASE7/CASE8 repair validation
        run: npm run test:cutover-postpub
      - name: Deployment/config publication-readiness owner validation
        run: npm run test:cutover-deployment-config
      - name: WIF/GCL1/provenance/fencing validation
        run: npm run test:cutover-wif
